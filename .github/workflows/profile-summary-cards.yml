name: GitHub-Profile-Summary-Cards

on:
  create:
  push:
  schedule:
    # Once a day at 00:23 JST. "* */24 * * *" meant every minute of hour 0 (actionlint error);
    # a minute off the top of the hour also avoids the busiest time for scheduled runs.
    - cron: "23 15 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-cards
    permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v5
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          # The README shows the files generated here, so the productive-time card's time zone is
          # set on the action (it used to be utcOffset=9 on the hosted API URL).
          TIME_ZONE: "Asia/Tokyo"
